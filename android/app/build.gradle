plugins {
    id 'com.android.application'
}

android {
    namespace 'pk.myherbal.app'
    compileSdk 34

    defaultConfig {
        applicationId 'pk.myherbal.app'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('APP_VERSION_CODE') ?: '0')
    }

    // کی اسٹور GitHub Actions میں بنتا ہے (ریپو میں کوئی خفیہ چابی نہیں رکھی جاتی)
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias 'myherbal'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
